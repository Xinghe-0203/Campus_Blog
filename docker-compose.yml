# ============================================
# 校园博客论坛系统 - Docker Compose 配置
# 包含 MySQL 8.0 + Spring Boot 应用
# ============================================

version: '3.8'

services:
  # ============================================
  # MySQL 8.0 数据库服务
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: campus-blog-mysql
    restart: unless-stopped
    environment:
      # 数据库配置（与 .env 文件对应）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-campus_blog}
      MYSQL_USER: ${DB_USERNAME:-campus_blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_password}
      # 字符集配置
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      # 持久化数据库数据
      - mysql_data:/var/lib/mysql
      # 初始化脚本（首次启动时自动执行）
      - ./数据库表.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - campus-blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      # MySQL 8.0 特殊配置
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-log-bin
      --auto-increment-increment=1
      --bind-address=0.0.0.0

  # ============================================
  # Spring Boot 应用服务
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-blog-app
    restart: unless-stopped
    depends_on:
      # 确保 MySQL 就绪后再启动应用
      mysql:
        condition: service_healthy
    environment:
      # 数据库连接配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-campus_blog}
      DB_USERNAME: ${DB_USERNAME:-campus_blog}
      DB_PASSWORD: ${DB_PASSWORD:-your_password}
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here_minimum_32_characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # 服务配置
      SERVER_PORT: 8825
      # CORS 配置（生产环境请修改为具体域名）
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8825:8825"
    volumes:
      # 持久化上传文件
      - app_uploads:/app/uploads
    networks:
      - campus-blog-network
    healthcheck:
      test: ["CMD", "wget", "--no-standalone", "-qO-", "http://localhost:8825/api/doc.html"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================
  # 可选：phpMyAdmin（数据库管理界面）
  # 仅在需要时启用，访问 http://localhost:8080
  # ============================================
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: campus-blog-phpmyadmin
  #   restart: unless-stopped
  #   depends_on:
  #     - mysql
  #   environment:
  #     PMA_HOST: mysql
  #     PMA_PORT: 3306
  #   ports:
  #     - "8080:80"
  #   networks:
  #     - campus-blog-network

# ============================================
# 网络配置
# ============================================
networks:
  campus-blog-network:
    driver: bridge

# ============================================
# 卷配置（数据持久化）
# ============================================
volumes:
  # MySQL 数据卷
  mysql_data:
    driver: local
  # 应用上传文件卷
  app_uploads:
    driver: local